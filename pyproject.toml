[project]
name = "naryadai"
version = "0.1.0"
description = "NaryadAI: industrial maintenance work orders and decision support"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.15,<2",
    "argon2-cffi>=25,<26",
    "cryptography>=45,<51",
    "fastapi>=0.115,<1",
    "httpx2>=2.13.1,<3",
    "pillow>=12,<13",
    "psycopg[binary]>=3.2,<4",
    "py-vapid>=1.9,<2",
    "pydantic-settings>=2.8,<3",
    "pywebpush>=2,<3",
    "requests>=2.32,<3",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "uvicorn>=0.34,<1",
    "websockets>=15,<17",
]

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8.3,<10",
    "pytest-asyncio>=1,<2",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
    "types-requests>=2.33.0.20260906",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/naryadai"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/migrations",
    "/alembic.ini",
    "/scripts",
    "/compose.yaml",
    "/README.md",
    "/pyproject.toml",
    "/uv.lock",
    "/.python-version",
    "/.node-version",
    "/frontend/.prettierrc.json",
    "/frontend/package.json",
    "/frontend/package-lock.json",
    "/frontend/index.html",
    "/frontend/vite.config.ts",
    "/frontend/vitest.config.ts",
    "/frontend/tsconfig.json",
    "/frontend/eslint.config.js",
    "/frontend/playwright.config.ts",
    "/frontend/src",
    "/frontend/public",
    "/frontend/e2e",
    "/.env.example",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src"]
extend-exclude = [".codex", "tmp"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers -ra"
filterwarnings = ["error"]

[tool.coverage.run]
# SQLAlchemy async bridges use greenlet; Argon2 verification uses worker threads.
concurrency = ["thread", "greenlet"]
branch = true
source = ["naryadai"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 90
