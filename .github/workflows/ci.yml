name: Quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_DB: naryadai_test
          POSTGRES_USER: test_runner
          POSTGRES_PASSWORD: ephemeral-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_runner -d naryadai_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      NARYADAI_TEST_DATABASE_URL: postgresql+psycopg://test_runner:ephemeral-ci-only@127.0.0.1:5432/naryadai_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.19"
          enable-cache: true
      - name: Install locked environment
        run: uv sync --locked
      - name: Lint
        run: uv run --locked ruff check .
      - name: Formatting
        run: uv run --locked ruff format --check .
      - name: Types
        run: uv run --locked mypy
      - name: Tests including required PostgreSQL
        run: uv run --locked pytest --require-db --cov=naryadai --cov-report=term-missing --cov-report=xml
      - name: Build package
        run: uv build
      - name: Check patch whitespace
        run: git diff --check

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Types
        run: npm run typecheck
      - name: Formatting
        run: npm run format:check
      - name: API and offline queue tests
        run: npm test
      - name: Production PWA build
        run: npm run build
